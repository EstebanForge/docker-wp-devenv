; PHP-FPM pool configuration.
;
; Historically this file set env[GEM_PATH] to a hardcoded Ruby 3.1.0 gem path
; so that catchmail (the Ruby mail gem, spawned via sendmail_path) could locate
; its gems. That broke when the image moved to Ruby 3.3.x: the stale 3.1.0 path
; hid net-smtp and crashed every send with `Could not find 'net-smtp'`,
; silently turning mail() false under FPM (WP-CLI was unaffected, since pool
; env[] directives only apply to FPM-spawned processes).
;
; The override is intentionally removed. Ruby resolves its own default gem
; paths (via Gem.default_path / rubygems-integration) correctly without it.
; Keep this file as a placeholder so no env[GEM_PATH] is inherited from a
; stale image layer.
[www]
